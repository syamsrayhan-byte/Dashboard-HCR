<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HCR.ID — Office Dashboard</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#040a1e">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="HCR Dashboard">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700;12..96,800&family=Manrope:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#040a1e;
  --panel:rgba(11,22,52,.68);
  --panel2:rgba(8,15,38,.55);
  --card-grad-a:rgba(18,32,72,.92);
  --card-grad-b:rgba(10,18,44,.92);
  --ink:#eaf0ff;
  --muted:#8d9ac6;
  --faint:#5d6b9c;
  --line:rgba(128,158,255,.14);
  --line-strong:rgba(128,158,255,.3);
  --blue:#3b82f6;
  --orange:#fea303;
  --sky:#38bdf8;
  --violet:#a78bfa;
  --green:#34d399;
  --red:#ff7d9d;
  --input-bg:rgba(5,10,26,.85);
  --hover-tint:rgba(254,163,3,.05);
  --card-shadow:0 12px 34px rgba(0,0,0,.32);
  --btn-ink:#241300;
  --logo-filter:brightness(1.5) saturate(1.1);
  --aurora-op:.32;
  --r:18px;
}
[data-theme="light"]{
  --bg:#f3f5fb;
  --panel:#ffffff;
  --panel2:#f7f9fe;
  --card-grad-a:#ffffff;
  --card-grad-b:#fbfcff;
  --ink:#152244;
  --muted:#5c6a94;
  --faint:#8b96bb;
  --line:rgba(21,40,90,.12);
  --line-strong:rgba(21,40,90,.24);
  --input-bg:#f2f4fa;
  --hover-tint:rgba(254,163,3,.06);
  --card-shadow:0 10px 30px rgba(23,42,94,.08);
  --logo-filter:none;
  --aurora-op:.14;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scrollbar-color:#22305e var(--bg)}
[data-theme="light"] html{scrollbar-color:#c6d0e8 var(--bg)}
body{background:var(--bg);color:var(--ink);font-family:'Manrope',sans-serif;min-height:100vh;overflow-x:hidden;transition:background .3s,color .3s}
.aurora{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;opacity:var(--aurora-op)}
.aurora i{position:absolute;border-radius:50%;filter:blur(100px)}
.aurora i:nth-child(1){width:52vw;height:52vw;left:-18vw;top:-22vw;background:radial-gradient(circle,#1a3d92,transparent 65%)}
.aurora i:nth-child(2){width:38vw;height:38vw;right:-14vw;top:8vh;background:radial-gradient(circle,rgba(254,163,3,.5),transparent 65%)}
::selection{background:rgba(254,163,3,.3)}

.display{font-family:'Bricolage Grotesque',sans-serif;letter-spacing:-.015em}
.mono{font-family:'IBM Plex Mono',monospace}
.eyebrow{font-family:'IBM Plex Mono',monospace;font-size:.62rem;letter-spacing:.3em;text-transform:uppercase;color:var(--faint)}

/* ---------- LOGIN ---------- */
#login{position:relative;z-index:2;min-height:100vh;display:none;align-items:center;justify-content:center;padding:24px}
#login.on{display:flex}
.orbit-wrap{position:relative;width:min(460px,100%)}
.orbit{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);border-radius:50%;border:1px solid var(--line);pointer-events:none}
.orbit.o1{width:580px;height:580px}
.orbit.o2{width:740px;height:740px;border-style:dashed;opacity:.6}
.orbit .sat{position:absolute;width:8px;height:8px;border-radius:50%;top:-4px;left:50%;background:var(--orange);box-shadow:0 0 10px 2px rgba(254,163,3,.6)}
.orbit.o2 .sat{background:var(--sky);box-shadow:0 0 10px 2px rgba(56,189,248,.55)}
@media (prefers-reduced-motion:no-preference){
  .orbit.o1{animation:spin 24s linear infinite}
  .orbit.o2{animation:spin 44s linear infinite reverse}
  @keyframes spin{to{transform:translate(-50%,-50%) rotate(360deg)}}
}
.login-card{
  position:relative;background:var(--panel);
  border:1px solid var(--line-strong);border-radius:26px;padding:42px 40px 34px;
  backdrop-filter:blur(18px);box-shadow:var(--card-shadow);
}
.brand-logo{display:block;width:200px;max-width:70%;margin:0 auto 8px;filter:var(--logo-filter)}
.brand-tag{text-align:center;font-family:'IBM Plex Mono',monospace;font-size:.6rem;letter-spacing:.34em;text-transform:uppercase;color:var(--faint);margin-bottom:32px}
.field{margin-bottom:16px}
.field label{display:block;font-size:.66rem;letter-spacing:.22em;text-transform:uppercase;color:var(--muted);margin-bottom:8px;font-family:'IBM Plex Mono',monospace}
.field input,.field textarea,.field select{
  width:100%;background:var(--input-bg);border:1px solid var(--line);border-radius:12px;
  padding:12px 14px;color:var(--ink);font-family:'Manrope',sans-serif;font-size:.92rem;
  transition:border-color .2s,box-shadow .2s;
}
.field textarea{resize:vertical;min-height:96px;line-height:1.55}
.field input:focus,.field textarea:focus,.field select:focus{outline:none;border-color:rgba(254,163,3,.6);box-shadow:0 0 0 3px rgba(254,163,3,.14)}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;
  border:1px solid rgba(224,140,0,.55);border-radius:12px;padding:13px 20px;
  background:linear-gradient(120deg,#fea303,#ef8b00);color:var(--btn-ink);font-family:'Bricolage Grotesque',sans-serif;
  font-weight:700;font-size:.92rem;letter-spacing:.02em;
  box-shadow:0 6px 18px rgba(254,163,3,.28);
  transition:transform .15s,box-shadow .2s;
}
.btn.full{width:100%}
.btn:hover{transform:translateY(-1px);box-shadow:0 8px 26px rgba(254,163,3,.4)}
.btn.ghost{background:var(--panel2);color:var(--muted);border-color:var(--line);box-shadow:none;font-family:'Manrope',sans-serif;font-weight:600}
.btn.ghost:hover{color:var(--ink);border-color:var(--line-strong)}
.btn.danger{background:rgba(255,125,157,.1);color:var(--red);border-color:rgba(255,125,157,.35);box-shadow:none}
.btn:focus-visible,.chip:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--orange);outline-offset:2px}
.login-err{color:var(--red);font-size:.8rem;min-height:1.2em;margin:2px 0 10px}

/* ---------- APP SHELL ---------- */
#app{position:relative;z-index:2;display:none;min-height:100vh}
#app.on{display:grid;grid-template-columns:252px 1fr}
aside{
  border-right:1px solid var(--line);padding:26px 18px;display:flex;flex-direction:column;gap:6px;
  background:var(--panel);backdrop-filter:blur(14px);
  position:sticky;top:0;height:100vh;
}
.side-logo{padding:2px 8px 24px}
.side-logo img{width:150px;filter:var(--logo-filter)}
.nav-label{padding:12px 10px 8px;font-family:'IBM Plex Mono',monospace;font-size:.6rem;letter-spacing:.3em;text-transform:uppercase;color:var(--faint)}
.nav-btn{
  display:flex;align-items:center;gap:12px;width:100%;padding:10px 12px;border-radius:12px;cursor:pointer;
  background:transparent;border:1px solid transparent;color:var(--muted);font-family:'Manrope',sans-serif;
  font-weight:500;font-size:.88rem;text-align:left;transition:.18s;
}
.nav-btn svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.7;flex:none}
.nav-btn .ls{display:none}
.nav-btn:hover{color:var(--ink);background:var(--hover-tint)}
.nav-btn.active{color:var(--orange);background:rgba(254,163,3,.1);border-color:rgba(254,163,3,.32)}
.theme-row{display:flex;gap:8px;padding:10px 4px 12px}
.theme-btn{flex:1;display:flex;align-items:center;justify-content:center;gap:7px;padding:9px;border-radius:11px;cursor:pointer;
  background:var(--panel2);border:1px solid var(--line);color:var(--muted);font-family:'IBM Plex Mono',monospace;font-size:.62rem;letter-spacing:.1em;text-transform:uppercase;transition:.18s}
.theme-btn svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:1.8}
.theme-btn.on{color:var(--orange);border-color:rgba(254,163,3,.45);background:rgba(254,163,3,.09)}
.side-user{border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;gap:10px;align-items:center;background:var(--panel2)}
.mt-auto{margin-top:auto}
.avatar{border-radius:12px;display:grid;place-items:center;font-family:'Bricolage Grotesque',sans-serif;font-weight:700;flex:none}
.side-user b{display:block;font-size:.84rem;font-weight:700}
.side-user span{font-size:.66rem;color:var(--muted)}
.logout{margin-left:auto;background:none;border:none;color:var(--faint);cursor:pointer;padding:6px}
.logout:hover{color:var(--red)}
.logout svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8}

main{padding:34px clamp(20px,4vw,52px) 70px;min-width:0}
.topline{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:28px}
.topline h2{font-family:'Bricolage Grotesque',sans-serif;font-size:clamp(1.5rem,2.6vw,2.15rem);font-weight:800;letter-spacing:-.02em}
.topline .sub{color:var(--muted);font-size:.88rem;margin-top:6px;max-width:62ch;line-height:1.55}
.clock{font-family:'IBM Plex Mono',monospace;font-size:.7rem;color:var(--faint);text-align:right;letter-spacing:.06em}
.clock b{display:block;color:var(--muted);font-size:.88rem;letter-spacing:.02em}

.div-badge{display:inline-flex;align-items:center;gap:8px;padding:5px 12px;border-radius:999px;font-family:'IBM Plex Mono',monospace;font-size:.62rem;letter-spacing:.14em;text-transform:uppercase;border:1px solid}
.div-badge i,.pill i{width:7px;height:7px;border-radius:50%;display:inline-block;flex:none}

.grid{display:grid;gap:16px}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:repeat(2,1fr)}
.card{
  background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:22px;
  backdrop-filter:blur(12px);position:relative;box-shadow:var(--card-shadow);
}
.stat-num{font-family:'IBM Plex Mono',monospace;font-size:clamp(1.3rem,2.2vw,1.75rem);font-weight:600;margin:10px 0 4px}
.stat-note{font-size:.76rem;color:var(--muted)}
.card h3{font-family:'Bricolage Grotesque',sans-serif;font-size:1.02rem;font-weight:700;margin-bottom:16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.card h3 .eyebrow{margin-left:auto}
.accent-top{border-top:2px solid var(--ac,var(--blue))}

table{width:100%;border-collapse:collapse;font-size:.86rem}
th{font-family:'IBM Plex Mono',monospace;font-size:.6rem;letter-spacing:.22em;text-transform:uppercase;color:var(--faint);text-align:left;padding:10px 12px;border-bottom:1px solid var(--line)}
td{padding:13px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:none}
tbody tr{transition:background .15s}
tbody tr:hover{background:var(--hover-tint)}
td .mono{font-size:.82rem}
.right{text-align:right}
.pill{display:inline-flex;align-items:center;gap:7px;padding:4px 11px;border-radius:999px;font-family:'IBM Plex Mono',monospace;font-size:.62rem;letter-spacing:.1em;text-transform:uppercase;border:1px solid;white-space:nowrap}
.p-paid{color:#0d9463;border-color:rgba(52,211,153,.45);background:rgba(52,211,153,.1)} .p-paid i{background:var(--green)}
.p-unpaid{color:#d9536f;border-color:rgba(255,125,157,.4);background:rgba(255,125,157,.08)} .p-unpaid i{background:var(--red)}
[data-theme="dark"] .p-paid{color:#8ff0c9}
[data-theme="dark"] .p-unpaid{color:#ffc0cf}
.p-grey{color:var(--muted);border-color:var(--line);background:var(--panel2)} .p-grey i{background:var(--faint)}

.chip{cursor:pointer;background:var(--panel2);border:1px solid var(--line);border-radius:999px;color:var(--muted);font-family:'IBM Plex Mono',monospace;font-size:.65rem;letter-spacing:.08em;padding:7px 14px;transition:.18s;text-transform:uppercase}
.chip:hover{color:var(--ink);border-color:var(--line-strong)}
.chip.on{color:var(--orange);border-color:rgba(254,163,3,.55);background:rgba(254,163,3,.1)}
.chip-row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px;align-items:center}
.bar{height:6px;border-radius:99px;background:var(--line);overflow:hidden}
.bar b{display:block;height:100%;border-radius:99px}

/* ---------- BOARD ---------- */
.board-wrap{overflow-x:auto;padding-bottom:14px}
.board{display:flex;gap:14px;align-items:flex-start;min-width:min-content}
.kcol{background:var(--panel2);border:1px solid var(--line);border-radius:var(--r);padding:13px;width:272px;flex:none;transition:border-color .2s}
.kcol.dragover{border-color:rgba(254,163,3,.65);background:var(--hover-tint)}
.kcol-head{display:flex;align-items:center;gap:8px;padding:2px 4px 12px}
.kcol-head input{
  background:transparent;border:1px solid transparent;border-radius:8px;color:var(--muted);
  font-family:'IBM Plex Mono',monospace;font-size:.64rem;letter-spacing:.22em;text-transform:uppercase;
  padding:5px 7px;width:100%;min-width:0;transition:.2s}
.kcol-head input:hover{border-color:var(--line)}
.kcol-head input:focus{outline:none;border-color:rgba(254,163,3,.5);color:var(--ink)}
.kcol-head .fixed-name{font-family:'IBM Plex Mono',monospace;font-size:.64rem;letter-spacing:.22em;text-transform:uppercase;color:var(--muted);padding:5px 7px;width:100%}
.kcol-head .count{font-family:'IBM Plex Mono',monospace;font-size:.62rem;color:var(--faint);flex:none}
.kcol-x{background:none;border:none;color:var(--faint);cursor:pointer;font-size:.95rem;line-height:1;padding:4px 6px;border-radius:7px;flex:none}
.kcol-x:hover{color:var(--red);background:rgba(255,125,157,.08)}
.kcard{background:linear-gradient(150deg,var(--card-grad-a),var(--card-grad-b));border:1px solid var(--line);border-radius:13px;padding:13px;margin-bottom:10px;cursor:grab;transition:.18s;position:relative;box-shadow:var(--card-shadow)}
.kcard:hover{border-color:rgba(254,163,3,.45);transform:translateY(-2px)}
.kcard.dragging{opacity:.4;cursor:grabbing}
.kcard.static{cursor:pointer}
.kcard b{display:block;font-size:.85rem;font-weight:700;margin-bottom:7px;line-height:1.4}
.kcard .meta{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:.68rem;color:var(--muted)}
.kcard .teams{display:flex;gap:5px;margin-top:9px;flex-wrap:wrap;align-items:center}
.tdot{width:16px;height:16px;border-radius:6px;display:grid;place-items:center;font-family:'IBM Plex Mono',monospace;font-size:.48rem;font-weight:600}
.quick-add{width:100%;background:transparent;border:1px dashed var(--line);border-radius:11px;color:var(--faint);
  font-family:'Manrope',sans-serif;font-size:.78rem;padding:9px 12px;cursor:pointer;transition:.2s;text-align:left}
.quick-add:hover{color:var(--orange);border-color:rgba(254,163,3,.45)}
.quick-input{width:100%;background:var(--input-bg);border:1px solid rgba(254,163,3,.45);border-radius:11px;color:var(--ink);
  font-family:'Manrope',sans-serif;font-size:.82rem;padding:10px 12px}
.quick-input:focus{outline:none}
.add-col{flex:none;width:220px;background:transparent;border:1px dashed var(--line);border-radius:var(--r);color:var(--faint);
  font-family:'Manrope',sans-serif;font-size:.82rem;padding:16px;cursor:pointer;transition:.2s}
.add-col:hover{color:var(--orange);border-color:rgba(254,163,3,.4)}

/* ---------- MODAL ---------- */
.overlay{position:fixed;inset:0;z-index:80;background:rgba(4,8,20,.6);backdrop-filter:blur(6px);display:none;align-items:flex-start;justify-content:center;padding:6vh 18px;overflow-y:auto}
[data-theme="light"] .overlay{background:rgba(30,45,90,.32)}
.overlay.on{display:flex}
.modal{width:min(620px,100%);background:var(--panel);
  border:1px solid var(--line-strong);border-radius:22px;padding:30px;box-shadow:0 40px 100px rgba(0,0,0,.35)}
.modal h3{font-family:'Bricolage Grotesque',sans-serif;font-size:1.15rem;font-weight:800;margin-bottom:22px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.modal-x{background:none;border:none;color:var(--faint);cursor:pointer;font-size:1.15rem;padding:4px 8px;border-radius:8px}
.modal-x:hover{color:var(--ink);background:var(--hover-tint)}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.team-picker{display:flex;gap:8px;flex-wrap:wrap}
.team-chip{cursor:pointer;border-radius:999px;padding:8px 15px;font-family:'IBM Plex Mono',monospace;font-size:.66rem;letter-spacing:.1em;border:1px solid var(--line);background:var(--panel2);color:var(--muted);transition:.18s}
.modal-actions{display:flex;gap:10px;margin-top:24px;flex-wrap:wrap}
.modal-actions .btn{flex:1}
.modal .byline{font-size:.68rem;color:var(--faint);font-family:'IBM Plex Mono',monospace;margin-top:16px;letter-spacing:.05em}
.ro-row{display:flex;justify-content:space-between;gap:14px;padding:10px 0;border-bottom:1px solid var(--line);font-size:.86rem}
.ro-row span:first-child{color:var(--muted);font-size:.72rem;text-transform:uppercase;letter-spacing:.14em;font-family:'IBM Plex Mono',monospace;padding-top:2px}
.ro-row span:last-child{text-align:right}

/* ---------- CALENDAR ---------- */
.cal-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.cal-head h3{font-family:'Bricolage Grotesque',sans-serif;font-size:1.3rem;font-weight:800;min-width:210px}
.cal-nav{display:flex;gap:6px}
.cal-nav button,.cal-today{border-radius:10px;background:var(--panel2);border:1px solid var(--line);color:var(--muted);cursor:pointer;transition:.18s}
.cal-nav button{width:36px;height:36px;font-size:1rem}
.cal-today{padding:0 14px;height:36px;font-family:'IBM Plex Mono',monospace;font-size:.68rem;letter-spacing:.1em;text-transform:uppercase}
.cal-nav button:hover,.cal-today:hover{color:var(--orange);border-color:rgba(254,163,3,.45)}
.cal-legend{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--panel2)}
.cal-dow{padding:10px 8px;text-align:center;font-family:'IBM Plex Mono',monospace;font-size:.6rem;letter-spacing:.2em;text-transform:uppercase;color:var(--faint);border-bottom:1px solid var(--line)}
.cal-cell{height:116px;overflow:hidden;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:8px;cursor:pointer;transition:background .15s;position:relative}
.cal-cell:nth-child(7n){border-right:none}
.cal-cell:hover{background:var(--hover-tint)}
.cal-cell.dim{opacity:.4}
.cal-cell .dnum{font-family:'IBM Plex Mono',monospace;font-size:.72rem;color:var(--muted);width:24px;height:24px;display:grid;place-items:center;border-radius:8px;margin-bottom:6px}
.cal-cell.today .dnum{background:var(--orange);color:#241300;font-weight:600}
.cal-cell.sel{box-shadow:inset 0 0 0 2px rgba(254,163,3,.55);background:var(--hover-tint)}
.day-panel{margin-top:16px;border-top:1px solid var(--line);padding-top:14px}
.day-panel-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.day-panel-head b{font-family:'Bricolage Grotesque',sans-serif;font-size:.95rem}
.day-item{display:flex;gap:11px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line);cursor:pointer;width:100%;background:none;border-left:none;border-right:none;border-top:none;color:var(--ink);text-align:left;font-family:'Manrope',sans-serif}
.day-item:last-of-type{border-bottom:none}
.day-item:hover{background:var(--hover-tint)}
.day-item i{width:9px;height:9px;border-radius:50%;flex:none}
.day-item b{font-size:.86rem;display:block}
.day-item span.sub{font-size:.7rem;color:var(--muted)}
.cal-ev{display:block;width:100%;text-align:left;border:none;font-family:'Manrope',sans-serif;font-size:.66rem;font-weight:600;color:var(--ink);padding:3px 7px;border-radius:6px;margin-bottom:4px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:var(--evbg);border-left:2px solid var(--evc);transition:.15s}
.cal-ev-t{font-family:'IBM Plex Mono',monospace;font-weight:500;opacity:.75;font-size:.92em}
.cal-ev:hover{filter:brightness(1.12)}
.cal-ev{cursor:grab}
.cal-ev.dragging{opacity:.4;cursor:grabbing}
.cal-more{font-family:'IBM Plex Mono',monospace;font-size:.58rem;color:var(--faint)}
/* ---------- date picker ---------- */
.dp-wrap{position:relative}
.dp-wrap input{cursor:pointer}
.dp-pop{position:absolute;z-index:30;top:calc(100% + 6px);left:0;width:274px;background:var(--panel);border:1px solid var(--line-strong);border-radius:14px;padding:12px;box-shadow:0 18px 50px rgba(0,0,0,.3)}
.dp-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;gap:6px}
.dp-head b{font-family:'Bricolage Grotesque',sans-serif;font-size:.84rem;flex:1;text-align:center}
.dp-head button{width:28px;height:28px;border-radius:8px;background:var(--panel2);border:1px solid var(--line);color:var(--muted);cursor:pointer;flex:none}
.dp-head button:hover{color:var(--orange);border-color:rgba(254,163,3,.45)}
.dp-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.dp-grid span{font-family:'IBM Plex Mono',monospace;font-size:.54rem;color:var(--faint);text-align:center;padding:4px 0;text-transform:uppercase}
.dp-grid button{aspect-ratio:1;border:none;border-radius:8px;background:transparent;color:var(--ink);font-family:'IBM Plex Mono',monospace;font-size:.7rem;cursor:pointer}
.dp-grid button:hover{background:var(--hover-tint);color:var(--orange)}
.dp-grid button.dim{color:var(--faint);opacity:.5}
.dp-grid button.sel{background:var(--orange);color:#241300;font-weight:600}
.dp-grid button.tod{box-shadow:inset 0 0 0 1px rgba(254,163,3,.55)}
.dp-clear{width:100%;margin-top:8px;background:transparent;border:1px dashed var(--line);border-radius:9px;color:var(--faint);font-family:'IBM Plex Mono',monospace;font-size:.62rem;letter-spacing:.1em;text-transform:uppercase;padding:7px;cursor:pointer}
.dp-clear:hover{color:var(--red);border-color:rgba(255,125,157,.4)}
.hint{font-size:.7rem;color:var(--faint);margin-top:14px;font-family:'IBM Plex Mono',monospace;letter-spacing:.04em}
.empty{padding:30px;text-align:center;color:var(--faint);font-size:.84rem}
.toggle-pay{cursor:pointer;border:none;background:none;padding:0}

/* todo & log */
.todo-row{display:flex;align-items:center;gap:14px;padding:13px 0;border-bottom:1px solid var(--line)}
.todo-row:last-child{border-bottom:none}
.todo-check{width:22px;height:22px;border-radius:8px;border:1px solid var(--line-strong);background:var(--input-bg);cursor:pointer;flex:none;display:grid;place-items:center;color:transparent;transition:.18s;font-size:.7rem}
.todo-check:hover{border-color:var(--green)}
.todo-check.done{background:rgba(52,211,153,.2);border-color:var(--green);color:var(--green)}
.log-input-row{display:flex;gap:10px}
.log-input-row input{flex:1;background:var(--input-bg);border:1px solid var(--line);border-radius:12px;padding:12px 14px;color:var(--ink);font-family:'Manrope',sans-serif;font-size:.9rem}
.log-input-row input:focus{outline:none;border-color:rgba(254,163,3,.55)}
.log-item{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
.log-item:last-child{border-bottom:none}
.log-item .time{font-family:'IBM Plex Mono',monospace;font-size:.66rem;color:var(--faint);padding-top:3px;flex:none;width:44px}
.log-item p{font-size:.86rem;flex:1;line-height:1.5}
.log-del{background:none;border:none;color:var(--faint);cursor:pointer;font-size:.8rem;padding:2px 6px;border-radius:6px;opacity:0;transition:.15s}
.log-item:hover .log-del{opacity:1}
.log-del:hover{color:var(--red)}
.log-day{font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:.85rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:18px 0 8px}
.log-day:first-child{padding-top:0}

/* responsive */
@media(max-width:1080px){.g3{grid-template-columns:1fr 1fr}}
@media(max-width:860px){
  #app.on{grid-template-columns:1fr}
  aside{position:fixed;bottom:0;top:auto;left:0;right:0;height:auto;flex-direction:row;align-items:stretch;padding:6px 6px calc(6px + env(safe-area-inset-bottom));gap:0;border-right:none;border-top:1px solid var(--line);z-index:50}
  #nav{display:flex;flex:1;justify-content:space-evenly;align-items:stretch;gap:0}
  .side-logo,.nav-label,.side-user,.theme-row,.mt-auto{display:none}
  .nav-btn{flex:1 1 0;min-width:0;flex-direction:column;justify-content:center;align-items:center;gap:4px;font-size:.55rem;padding:7px 2px;border-radius:10px;text-align:center}
  .nav-btn .lf{display:none}
  .nav-btn .ls{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
  .nav-btn svg{width:19px;height:19px}
  .nav-btn.active{background:rgba(254,163,3,.12);border-color:transparent}
  main{padding:22px 14px 130px}
  .mob-top{display:flex!important}
  .topline h2{font-size:1.35rem}
  .topline .clock{display:none}
  .card{padding:16px}
  .modal{padding:20px;border-radius:18px}
  .overlay{padding:3vh 10px}
  .cal-head{padding:0 14px;margin-bottom:12px}
  .cal-head h3{font-size:1.05rem;min-width:0}
  .cal-legend{display:none}
  .cal-card{padding:16px 0;margin-left:-14px;margin-right:-14px;width:calc(100% + 28px);border-left:none;border-right:none;border-radius:0;background:transparent;box-shadow:none;border-top:none;border-bottom:none}
  .cal-grid{border-left:none;border-right:none;border-radius:0}
  .cal-dow{padding:7px 2px;font-size:.56rem}
  .cal-cell{height:78px;padding:4px 3px;overflow:hidden}
  .cal-cell .dnum{width:19px;height:19px;font-size:.6rem;margin-bottom:2px}
  .cal-ev{font-size:.5rem;padding:1.5px 3px;border-radius:4px;line-height:1.35;margin-bottom:2px;border-left-width:2px}
  .cal-ev-t{display:none}
  .cal-more{font-size:.5rem}
  .day-panel{padding:14px 14px 0}
  .kcol{width:min(272px,80vw)}
  .log-input-row{flex-wrap:wrap}
  .log-input-row .btn{flex:1}
  .f2{grid-template-columns:1fr}
}
@media(max-width:640px){.g3,.g2{grid-template-columns:1fr}}
.mob-top{display:none;align-items:center;justify-content:space-between;margin-bottom:20px;gap:10px}
.mob-top img{width:118px;filter:var(--logo-filter)}
.mob-top .mob-actions{display:flex;gap:8px;align-items:center}
.mob-top .theme-btn{flex:none;padding:8px 10px}
</style>

let S=null, me=null, view='home', projFilter='ALL';

async function loadState(){
  try{
    const { data, error } = await sb.from('app_state').select('data').eq('id', STATE_ROW_ID).maybeSingle();
    if(error) throw error;
    if(data && data.data){ S = data.data; return; }
  }catch(e){ console.error('loadState failed, falling back to seed data:', e); }
  S = JSON.parse(JSON.stringify(SEED));
  saveState();
}
let savingState = false;
async function saveState(){
  savingState = true;
  try{
    const { error } = await sb.from('app_state').upsert({ id: STATE_ROW_ID, data: S, updated_at: new Date().toISOString() });
    if(error) console.error('saveState failed:', error);
  }catch(e){ console.error('saveState failed:', e); }
  finally{ savingState = false; }
}

let realtimeChannel = null;
function subscribeRealtime(){
  if(realtimeChannel) return;
  realtimeChannel = sb.channel('app_state_sync')
    .on('postgres_changes', { event:'UPDATE', schema:'public', table:'app_state', filter:`id=eq.${STATE_ROW_ID}` }, payload => {
      if(savingState || !payload.new || !payload.new.data) return;
      S = payload.new.data;
      applyTheme();
      if(me){ renderShell(); render(); }
    })
    .subscribe();
}
async function afterAuth(session){
  const username = session.user.email.split('@')[0];
  await loadState();
  const found = S.users.find(x=>x.u===username);
  if(!found){
    await sb.auth.signOut();
    $('#loginErr').textContent='Akun tidak terdaftar di sistem.';
    return;
  }
  me=found; view='home'; projFilter='ALL';
  $('#login').classList.remove('on'); $('#app').classList.add('on');
  applyTheme(); renderShell(); render();
  subscribeRealtime();
}
$('#loginForm').addEventListener('submit', async e=>{
  e.preventDefault();
  const u=$('#u').value.trim().toLowerCase(), p=$('#p').value;
  $('#loginErr').textContent='';
  const { data, error } = await sb.auth.signInWithPassword({ email:`${u}@hcr.id`, password:p });
  if(error){ $('#loginErr').textContent='Username atau password salah. Coba lagi.'; return; }
  await afterAuth(data.session);
});
function logout(){
  sb.auth.signOut();
  me=null; S=null; closeModal();
  $('#app').classList.remove('on'); $('#login').classList.add('on');
  $('#u').value=''; $('#p').value=''; $('#loginErr').textContent='';
}

/* =============== ROUTER =============== */
function render(){
  const main=$('#main');
  if(view==='home')   main.innerHTML = vHome();
  if(view==='fee')    main.innerHTML = vFee();
  if(view==='proj')   main.innerHTML = vBoard();
  if(view==='client') main.innerHTML = vClientBoard();
  if(view==='cal')    main.innerHTML = vCal();
  if(view==='omset')  main.innerHTML = vOmset();
  if(view==='log')    main.innerHTML = vLog();
  bind(main);
  window.scrollTo({top:0});
}

/* =============== SHARED WIDGETS =============== */
function logTodayCard(mb){
  const entries = S.logs.filter(l=>l.userId===me.id && l.date===today()).sort((a,b)=>a.time.localeCompare(b.time));
  return `<div class="card accent-top" style="--ac:var(--orange);${mb?'margin-bottom:16px':''}">
    <h3>Log Hari Ini <span class="eyebrow">hanya kamu & admin yang bisa lihat</span></h3>
    <div class="log-input-row">
      <input id="logQuick" placeholder="Hari ini ngerjain apa? Tekan Enter untuk simpan…" maxlength="200">
      <button class="btn" style="padding:11px 16px;font-size:.82rem" data-addlog>Catat</button>
    </div>
    <div style="margin-top:14px">
    ${entries.length? entries.map(l=>`
      <div class="log-item">
        <span class="time">${esc(l.time)}</span>
        <p>${esc(l.text)}</p>
        <button class="log-del" data-dellog="${l.id}" aria-label="Hapus log">✕</button>
      </div>`).join('') : `<div class="empty" style="padding:18px">Belum ada catatan hari ini.</div>`}
    </div>
  </div>`;
}
function feeMiniList(myFees){
  return myFees.slice(0,5).map(f=>`
    <div style="display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)">
      <i style="width:8px;height:8px;border-radius:50%;flex:none;background:${f.status==='paid'?'var(--green)':'var(--orange)'}"></i>
      <div style="min-width:0;flex:1"><b style="font-size:.85rem;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(f.project)}</b>
      <span style="font-size:.7rem;color:var(--muted)">estimasi cair ${fmtDay(f.date)}</span></div>
      <span class="mono" style="font-size:.8rem">${IDR(f.amount)}</span>
      ${payPill(f.status)}
    </div>`).join('');
}
function incomeList(items, compact){
  return items.map(i=>{
    const owner=byId(i.by);
    return `<div class="todo-row">
      <div style="min-width:0;flex:1">
        <b style="font-size:.86rem;display:block">${esc(i.name)}</b>
        <span style="font-size:.7rem;color:var(--muted)">${compact?'':esc(owner.name)+' · '}dicatat ${fmtDay(i.date)}</span>
      </div>
      <span class="mono" style="font-size:.84rem">${IDR(i.amount)}</span>
      <button class="toggle-pay" data-income="${i.id}" title="Klik untuk ubah status">${moneyPill(i.status)}</button>
    </div>`;}).join('');
}

/* =============== BERANDA =============== */
function vHome(){
  const firstName = me.name.split(' ')[0];
  const d = D(me.div);
  if(me.div==='FIN') return vHomeFinance(firstName);
  if(me.div==='ADM') return vHomeAdmin(firstName);

  const myFees = S.fees.filter(f=>f.userId===me.id);
  const total = myFees.reduce((a,f)=>a+f.amount,0);
  const paid = myFees.filter(f=>f.status==='paid').reduce((a,f)=>a+f.amount,0);
  const unpaid = total-paid;
  const upcoming = [...S.events].filter(e=>e.date>=today() && (me.div==='DC' || e.type!=='Konten')).sort((a,b)=>a.date.localeCompare(b.date)).slice(0,4);
  const isBM = me.div==='BM';
  const myIncomes = isBM ? S.incomes.filter(i=>i.by===me.id) : [];

  return topline(`Halo, ${esc(firstName)} 👋`, `${d.name} — ${d.desc}.`) + `
  <div class="grid g3" style="margin-bottom:16px">
    <div class="card accent-top" style="--ac:var(--blue)">
      <div class="eyebrow">Total Fee In-Charge</div>
      <div class="stat-num">${IDR(total)}</div>
      <div class="stat-note">${myFees.length} project fee atas nama kamu</div>
    </div>
    <div class="card accent-top" style="--ac:var(--green)">
      <div class="eyebrow">Sudah Dibayar</div>
      <div class="stat-num" style="color:var(--green)">${IDR(paid)}</div>
      <div style="margin-top:10px" class="bar"><b style="width:${total?Math.round(paid/total*100):0}%;background:var(--green)"></b></div>
    </div>
    <div class="card accent-top" style="--ac:var(--orange)">
      <div class="eyebrow">Menunggu Pembayaran</div>
      <div class="stat-num" style="color:var(--orange)">${IDR(unpaid)}</div>
      <div class="stat-note">${myFees.filter(f=>f.status==='unpaid').length} fee berstatus unpaid</div>
    </div>
  </div>
  ${logTodayCard(true)}
  <div class="grid g2" style="margin-bottom:16px">
    <div class="card">
      <h3>Fee In-Charge <span class="eyebrow">${myFees.length} entri</span></h3>
      ${myFees.length? feeMiniList(myFees) : `<div class="empty">Belum ada fee tercatat.</div>`}
      <div style="margin-top:16px;display:flex;gap:10px;flex-wrap:wrap">
        <button class="btn" data-open-fee-form>+ Ajukan Fee Baru</button>
        <button class="btn ghost" data-goto="fee">Lihat Semua →</button>
      </div>
    </div>
    <div class="card">
      <h3>Agenda Terdekat <span class="eyebrow">kalender</span></h3>
      ${upcoming.map(e=>{
        const st=EVENT_STYLE[e.type];
        return `<div style="display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)">
          <i style="width:8px;height:8px;border-radius:50%;flex:none;background:${st.c}"></i>
          <div style="min-width:0;flex:1"><b style="font-size:.85rem;display:block">${esc(e.title)}</b>
          <span style="font-size:.7rem;color:var(--muted)">${fmtDay(e.date)} · ${e.type} · ${D(e.div).name}</span></div>
        </div>`;}).join('')}
      <div style="margin-top:16px"><button class="btn ghost" data-goto="cal">Buka Kalender →</button></div>
    </div>
  </div>
  ${isBM?`
  <div class="card accent-top" style="--ac:${D('BM').hue};margin-bottom:16px">
    <h3>Deal & Uang Masuk <span class="eyebrow">tercatat ke Finance</span>
      <button class="btn" style="padding:9px 16px;font-size:.8rem" data-open-income-form>+ Catat Deal Baru</button>
    </h3>
    ${myIncomes.length? incomeList(myIncomes,true) : `<div class="empty">Belum ada deal tercatat. Geser klien ke kolom Deal di menu Klien, atau catat manual di sini.</div>`}
    <p class="hint">* Klien yang digeser ke kolom "Deal" otomatis tercatat di sini & muncul di dashboard Finance. Kamu dan Finance sama-sama bisa ubah status Pending/Masuk.</p>
  </div>`:''}`;
}

function vHomeFinance(firstName){
  const pending = S.fees.filter(f=>f.status==='unpaid').sort((a,b)=>a.date.localeCompare(b.date));
  const paidFees = S.fees.filter(f=>f.status==='paid');
  const incomes = [...S.incomes].sort((a,b)=>b.date.localeCompare(a.date));
  const masuk = incomes.filter(i=>i.status==='masuk').reduce((a,i)=>a+i.amount,0);
  const pendingIn = incomes.filter(i=>i.status==='pending').reduce((a,i)=>a+i.amount,0);

  return topline(`Halo, ${esc(firstName)} 👋`, 'Personal dashboard Finance: to-do pembayaran fee karyawan dan uang masuk dari deal tim Business Manager.') + `
  <div class="grid g3" style="margin-bottom:16px">

/* =============== KALENDER =============== */
const MONTHS_ID = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
const DOW_ID = ['Sen','Sel','Rab','Kam','Jum','Sab','Min'];
function vCal(){
  const {y,m}=cal;
  const first=new Date(y,m,1);
  const startOffset=(first.getDay()+6)%7;
  const daysInMonth=new Date(y,m+1,0).getDate();
  const prevDays=new Date(y,m,0).getDate();
  const totalCells=42;
  const evByDate={};
  S.events.forEach(e=>{ (evByDate[e.date]=evByDate[e.date]||[]).push(e); });
  S.projects.filter(p=>p.due).forEach(p=>{
    const col=S.columns.find(c=>c.id===p.col);
    (evByDate[p.due]=evByDate[p.due]||[]).push({id:'proj_'+p.id, type:'Deadline', title:p.title, _tip:'Deadline project · '+(col?col.name:'')});
  });
  const pad=n=>String(n).padStart(2,'0');
  let cells='';
  for(let i=0;i<totalCells;i++){
    let dy,mm=m,yy=y,dim=false;
    if(i<startOffset){ dy=prevDays-startOffset+1+i; mm=m-1; dim=true; }
    else if(i>=startOffset+daysInMonth){ dy=i-startOffset-daysInMonth+1; mm=m+1; dim=true; }
    else dy=i-startOffset+1;
    if(mm<0){mm=11;yy--} if(mm>11){mm=0;yy++}
    const dstr=`${yy}-${pad(mm+1)}-${pad(dy)}`;
    const evs=(evByDate[dstr]||[]);
    cells+=`<div class="cal-cell ${dim?'dim':''} ${dstr===today()?'today':''} ${dstr===selDay?'sel':''}" data-day="${dstr}" role="button" tabindex="0" aria-label="Lihat agenda ${dstr}">
      <span class="dnum">${dy}</span>
      ${evs.slice(0,3).map(e=>{
        const st=EVENT_STYLE[e.type]||EVENT_STYLE.Meeting;
        const isProj=String(e.id).startsWith('proj_');
        const tprefix = e.time?e.time+' ':'';
        return `<button class="cal-ev" draggable="true" data-ev="${e.id}" style="--evc:${st.c};--evbg:${st.bg}" title="${tprefix}${esc(e._tip||e.title)}">${isProj?'◆ ':''}<span class="cal-ev-t">${tprefix}</span>${esc(e.title)}</button>`;}).join('')}
      ${evs.length>3?`<span class="cal-more">+${evs.length-3} lagi</span>`:''}
    </div>`;
  }
  const legend=Object.entries(EVENT_STYLE).map(([k,v])=>
    `<span class="pill" style="color:${v.c};border-color:${v.c}44;background:${v.c}12"><i style="background:${v.c}"></i>${k}</span>`).join('');
  const selEvs = S.events.filter(e=>e.date===selDay).sort((a,b)=>(a.time||'99:99').localeCompare(b.time||'99:99'));
  const selProjs = S.projects.filter(p=>p.due===selDay);
  return topline('Kalender','Klik tanggal untuk melihat agenda hari itu di panel bawah, drag item antar tanggal untuk menggeser jadwal. Item ◆ adalah deadline to-do dari Project Board yang tersambung otomatis.') + `
  <div class="card cal-card">
    <div class="cal-head">
      <h3 class="display">${MONTHS_ID[m]} ${y}</h3>
      <div class="cal-nav">
        <button data-calnav="-1" aria-label="Bulan sebelumnya">‹</button>
        <button data-calnav="1" aria-label="Bulan berikutnya">›</button>
      </div>
      <button class="cal-today" data-caltoday>Hari Ini</button>
      <div class="cal-legend">${legend}</div>
    </div>
    <div class="cal-grid">
      ${DOW_ID.map(d=>`<div class="cal-dow">${d}</div>`).join('')}

function vLog(){
  const isAdmin = me.div==='ADM';
  const logs = isAdmin ? S.logs : S.logs.filter(l=>l.userId===me.id);
  const dates = [...new Set(logs.map(l=>l.date))].sort().reverse();

  return topline('Log Harian', isAdmin
      ? 'Rekap harian pekerjaan seluruh tim. Hanya admin dan pemilik akun masing-masing yang bisa melihat log ini.'
      : 'Rekap harian pekerjaanmu. Hanya kamu dan admin yang bisa melihat halaman ini. Catat lewat sini atau lewat kartu Log Hari Ini di Personal Board.') + `
  ${!isAdmin?`
  <div class="card" style="margin-bottom:16px">
    <div class="log-input-row">
      <input id="logQuick" placeholder="Hari ini ngerjain apa? Tekan Enter untuk simpan…" maxlength="200">
      <button class="btn" style="padding:11px 16px;font-size:.82rem" data-addlog>Catat</button>
    </div>
  </div>`:''}
  <div class="card">
    ${dates.length? dates.map(dt=>{
      const dayLogs = logs.filter(l=>l.date===dt).sort((a,b)=>a.time.localeCompare(b.time));
      const byUser = {};
      dayLogs.forEach(l=>{ (byUser[l.userId]=byUser[l.userId]||[]).push(l); });
      return `<div class="log-day">${dt===today()?'Hari Ini · ':''}${fmtFull(dt)}</div>
        ${isAdmin
          ? Object.entries(byUser).map(([uidk,items])=>{
              const u=byId(uidk);
              return `<div style="display:flex;gap:12px;align-items:flex-start;padding:8px 0">
                ${avatarHtml(u,30)}
                <div style="flex:1;min-width:0">
                  <b style="font-size:.82rem">${esc(u.name)} <span style="color:${D(u.div).hue};font-size:.66rem;font-family:'IBM Plex Mono',monospace">· ${u.div}</span></b>
                  ${items.map(l=>`<div class="log-item"><span class="time">${esc(l.time)}</span><p>${esc(l.text)}</p></div>`).join('')}
                </div>
              </div>`;}).join('')
          : dayLogs.map(l=>`<div class="log-item"><span class="time">${esc(l.time)}</span><p>${esc(l.text)}</p><button class="log-del" data-dellog="${l.id}" aria-label="Hapus log">✕</button></div>`).join('')}
      `;}).join('') : `<div class="empty">Belum ada log tercatat.</div>`}
  </div>`;
}

/* =============== DATE PICKER =============== */
function attachDatePicker(input){
  let pop=null;
  let st=(()=>{ const iso=input.dataset.iso; const d=iso?new Date(iso+'T00:00:00'):new Date(); return {y:d.getFullYear(), m:d.getMonth()}; })();
  const pad=n=>String(n).padStart(2,'0');
  function close(){ if(pop){ pop.remove(); pop=null; document.removeEventListener('mousedown',outside); } }
  function outside(e){ if(pop && !pop.contains(e.target) && e.target!==input) close(); }
  function draw(){
    const first=new Date(st.y,st.m,1);
    const off=(first.getDay()+6)%7;
    const dim=new Date(st.y,st.m+1,0).getDate();
    const prevD=new Date(st.y,st.m,0).getDate();
    const cells=Math.ceil((off+dim)/7)*7;
    let grid='';
    for(let i=0;i<cells;i++){
      let dy,mm=st.m,yy=st.y,isDim=false;
      if(i<off){ dy=prevD-off+1+i; mm=st.m-1; isDim=true; }
      else if(i>=off+dim){ dy=i-off-dim+1; mm=st.m+1; isDim=true; }
      else dy=i-off+1;
      if(mm<0){mm=11;yy--} if(mm>11){mm=0;yy++}
      const dstr=`${yy}-${pad(mm+1)}-${pad(dy)}`;
      grid+=`<button type="button" data-pick="${dstr}" class="${isDim?'dim':''} ${dstr===input.dataset.iso?'sel':''} ${dstr===today()?'tod':''}">${dy}</button>`;
    }
    pop.innerHTML=`
      <div class="dp-head">
        <button type="button" data-dpnav="-1" aria-label="Bulan sebelumnya">‹</button>
        <b>${MONTHS_ID[st.m]} ${st.y}</b>
        <button type="button" data-dpnav="1" aria-label="Bulan berikutnya">›</button>
      </div>
      <div class="dp-grid">
        ${DOW_ID.map(d=>`<span>${d[0]}</span>`).join('')}
        ${grid}
      </div>
      <button type="button" class="dp-clear" data-dpclear>Kosongkan tanggal</button>`;
    pop.querySelectorAll('[data-dpnav]').forEach(b=>b.onclick=e=>{
      e.stopPropagation();
      st.m+=parseInt(b.dataset.dpnav,10);
      if(st.m<0){st.m=11;st.y--} if(st.m>11){st.m=0;st.y++}
      draw();
    });
    pop.querySelectorAll('[data-pick]').forEach(b=>b.onclick=e=>{
      e.stopPropagation();
      input.dataset.iso=b.dataset.pick;
      input.value=fmtDate(b.dataset.pick);
      close();
    });
    pop.querySelector('[data-dpclear]').onclick=e=>{
      e.stopPropagation();
      input.dataset.iso=''; input.value='';
      close();
    };
  }
  input.addEventListener('click',()=>{
    if(pop){ close(); return; }
    pop=document.createElement('div');
    pop.className='dp-pop';
    input.parentElement.appendChild(pop);
    draw();
    setTimeout(()=>document.addEventListener('mousedown',outside),0);
  });
}

function ensureIncomeForDeal(c){
  if(S.incomes.some(i=>i.clientId===c.id)) return;
  S.incomes.push({id:uid('in'), clientId:c.id, name:`Deal — ${c.name}`, amount:c.value||0, status:'pending', by:c.pic||me.id, date:today()});
}

function bindModal(){
  const M=$('#modal');
  M.querySelectorAll('[data-close]').forEach(b=>b.onclick=closeModal);
  M.querySelectorAll('.dp-wrap input[readonly]').forEach(attachDatePicker);
  const cstat=M.querySelector('#m-cstatus');
  if(cstat){ cstat.addEventListener('change',()=>{
    const w=M.querySelector('#m-lost-wrap');
    if(w) w.style.display = cstat.value==='Gagal' ? 'block' : 'none';
  }); }
  M.querySelectorAll('.team-chip').forEach(b=>b.onclick=()=>{
    const on=b.dataset.on==='1'?0:1; b.dataset.on=on;
    const d=D(b.dataset.team);
    b.style.cssText = on?`color:${d.hue};border-color:${d.hue}77;background:${d.hue}14`:'';
  });
  M.querySelectorAll('[data-savecard]').forEach(b=>b.onclick=()=>{
    const p=S.projects.find(x=>x.id===b.dataset.savecard); if(!p) return;
    const t=M.querySelector('#m-title').value.trim();
    if(t) p.title=t;
    p.desc=M.querySelector('#m-desc').value;
    p.due=M.querySelector('#m-due').dataset.iso||'';
    p.jenis=M.querySelector('#m-jenis').value;
    p.col=M.querySelector('#m-col').value;
    p.teams=[...M.querySelectorAll('.team-chip')].filter(c=>c.dataset.on==='1').map(c=>c.dataset.team);
    saveState(); closeModal(); render();
  });
  M.querySelectorAll('[data-delcard]').forEach(b=>b.onclick=()=>{
    S.projects=S.projects.filter(x=>x.id!==b.dataset.delcard);
    saveState(); closeModal(); render();
  });
  M.querySelectorAll('[data-saveclient]').forEach(b=>b.onclick=()=>{
    const name=M.querySelector('#m-cname').value.trim();
    if(!name){ M.querySelector('#m-cname').focus(); return; }
    const data={
      name,
      contact:M.querySelector('#m-ccontact').value.trim(),
      value:parseInt(M.querySelector('#m-cvalue').value||'0',10),
      pic:M.querySelector('#m-cpic').value,
      status:M.querySelector('#m-cstatus').value,
      phone:M.querySelector('#m-cphone').value.trim(),
      source:M.querySelector('#m-csource').value,
      note:M.querySelector('#m-cnote').value.trim(),
      desc:M.querySelector('#m-cdesc').value,
      lostReason:M.querySelector('#m-clost').value.trim()
    };
    let c;
    if(b.dataset.saveclient){ c=S.clients.find(x=>x.id===b.dataset.saveclient); Object.assign(c,data); }
    else { c={id:uid('c'),...data}; S.clients.push(c); }
    if(c.status==='Deal') ensureIncomeForDeal(c);
    saveState(); closeModal(); render();
  });
  M.querySelectorAll('[data-delclient]').forEach(b=>b.onclick=()=>{
    S.clients=S.clients.filter(x=>x.id!==b.dataset.delclient);
    saveState(); closeModal(); render();
  });
  M.querySelectorAll('[data-savefee]').forEach(b=>b.onclick=()=>{
    const proj=M.querySelector('#m-fproject').value.trim();
    const amt=parseInt(M.querySelector('#m-famount').value||'0',10);
    const dt=M.querySelector('#m-fdate').value||today();
    if(!proj||!amt){ M.querySelector('#m-fproject').focus(); return; }
    S.fees.push({id:uid('f'), userId:me.id, project:proj, amount:amt, status:'unpaid', date:dt});
    saveState(); closeModal(); render();
  });
  M.querySelectorAll('[data-saveincome]').forEach(b=>b.onclick=()=>{
    const name=M.querySelector('#m-iname').value.trim();
    const amt=parseInt(M.querySelector('#m-iamount').value||'0',10);
    const dt=M.querySelector('#m-idate').value||today();
    if(!name||!amt){ M.querySelector('#m-iname').focus(); return; }
    S.incomes.push({id:uid('in'), clientId:null, name, amount:amt, status:'pending', by:me.id, date:dt});
    saveState(); closeModal(); render();
  });
  M.querySelectorAll('[data-saveevent]').forEach(b=>b.onclick=()=>{
    const title=M.querySelector('#m-etitle').value.trim();
    const date=M.querySelector('#m-edate').value;
    if(!title||!date){ M.querySelector('#m-etitle').focus(); return; }
    const data={title, date, time:M.querySelector('#m-etime').value, desc:M.querySelector('#m-edesc').value, type:M.querySelector('#m-etype').value, div:M.querySelector('#m-ediv').value};
    if(b.dataset.saveevent){
      const ev=S.events.find(e=>e.id===b.dataset.saveevent);
      if(ev) Object.assign(ev,data);
    } else S.events.push({id:uid('e'),...data});
    saveState(); closeModal(); render();
  });
  M.querySelectorAll('[data-delevent]').forEach(b=>b.onclick=()=>{
    S.events=S.events.filter(e=>e.id!==b.dataset.delevent);
    saveState(); closeModal(); render();
  });
}

function bind(root){
  root.querySelectorAll('[data-goto]').forEach(b=>b.onclick=()=>{ view=b.dataset.goto; renderShell(); render(); });
  root.querySelectorAll('[data-open-fee-form]').forEach(b=>b.onclick=openFeeModal);

  root.querySelectorAll('.toggle-pay[data-fee]').forEach(b=>b.onclick=()=>{
    const f=S.fees.find(x=>x.id===b.dataset.fee); if(!f) return;
    if(me.div!=='ADM'&&me.div!=='FIN'&&f.userId!==me.id) return;
    f.status=f.status==='paid'?'unpaid':'paid';
    saveState(); render();
  });
  root.querySelectorAll('.toggle-pay[data-income]').forEach(b=>b.onclick=()=>{
    const i=S.incomes.find(x=>x.id===b.dataset.income); if(!i) return;
    if(!['BM','FIN','ADM'].includes(me.div)) return;
    i.status=i.status==='masuk'?'pending':'masuk';
    saveState(); render();
  });
  root.querySelectorAll('[data-paycheck]').forEach(b=>b.onclick=()=>{
    const f=S.fees.find(x=>x.id===b.dataset.paycheck); if(!f) return;
    b.classList.add('done');
    setTimeout(()=>{ f.status='paid'; saveState(); render(); },260);
  });
  root.querySelectorAll('[data-chip]').forEach(b=>b.onclick=()=>{ projFilter=b.dataset.chip; render(); });
  root.querySelectorAll('[data-target]').forEach(b=>b.onclick=()=>{
    const t=S.targets.find(x=>x.m===b.dataset.target); if(!t) return;
    const input=document.createElement('input');
    input.type='number'; input.min='0'; input.step='10000000'; input.value=t.t;
    input.className='quick-input'; input.style.cssText='width:160px;text-align:right;padding:7px 10px;font-size:.8rem';
    b.replaceWith(input); input.focus(); input.select();
    const commit=()=>{
      const v=parseInt(input.value||'0',10);
      if(!isNaN(v)&&v>=0){ t.t=v; saveState(); }
      render();
    };
    input.addEventListener('keydown',e=>{ if(e.key==='Enter') commit(); if(e.key==='Escape') render(); });
    input.addEventListener('blur',commit);
  });

  /* log harian */
  const lq=root.querySelector('#logQuick');
  if(lq){
    lq.addEventListener('keydown',e=>{ if(e.key==='Enter') addLogFromInput(lq); });
    root.querySelectorAll('[data-addlog]').forEach(b=>b.onclick=()=>addLogFromInput(lq));
  }
  root.querySelectorAll('[data-dellog]').forEach(b=>b.onclick=()=>{
    S.logs=S.logs.filter(l=>!(l.id===b.dataset.dellog && (l.userId===me.id||me.div==='ADM')));
    saveState(); render();
  });

  /* project board */
  root.querySelectorAll('.kcard[data-card]').forEach(card=>{
    card.addEventListener('click',()=>openCardModal(card.dataset.card));
    card.addEventListener('dragstart',e=>{
      e.dataTransfer.setData('text/plain','proj:'+card.dataset.card);
      e.dataTransfer.effectAllowed='move';
      card.classList.add('dragging');
    });
    card.addEventListener('dragend',()=>card.classList.remove('dragging'));
  });
  /* client board */
  root.querySelectorAll('.kcard[data-clientcard]').forEach(card=>{
    card.addEventListener('click',()=>openClientModal(card.dataset.clientcard));
    if(card.getAttribute('draggable')==='true'){
      card.addEventListener('dragstart',e=>{
        e.dataTransfer.setData('text/plain','client:'+card.dataset.clientcard);
        e.dataTransfer.effectAllowed='move';
        card.classList.add('dragging');
      });
      card.addEventListener('dragend',()=>card.classList.remove('dragging'));
    }
  });
  root.querySelectorAll('.kcol').forEach(col=>{
    col.addEventListener('dragover',e=>{ e.preventDefault(); col.classList.add('dragover'); });
    col.addEventListener('dragleave',()=>col.classList.remove('dragover'));
    col.addEventListener('drop',e=>{
      e.preventDefault(); col.classList.remove('dragover');
      const raw=e.dataTransfer.getData('text/plain');
      if(raw.startsWith('proj:') && col.dataset.kind==='proj'){
        const p=S.projects.find(x=>x.id===raw.slice(5));
        if(p&&p.col!==col.dataset.col){ p.col=col.dataset.col; saveState(); render(); }
      }
      if(raw.startsWith('client:') && col.dataset.kind==='client'){
        const c=S.clients.find(x=>x.id===raw.slice(7));
        if(c&&c.status!==col.dataset.cstatus){
          c.status=col.dataset.cstatus;
          if(c.status==='Deal') ensureIncomeForDeal(c);
          saveState(); render();
        }
      }
    });
  });

  /* quick add project */
  root.querySelectorAll('.quick-add[data-qa]').forEach(b=>b.onclick=()=>{
    const colId=b.dataset.qa;
    const input=document.createElement('input');
    input.className='quick-input';
    input.placeholder='Judul to-do, tekan Enter…';
    b.replaceWith(input); input.focus();
    const commit=()=>{
      const t=input.value.trim();
      if(t){
        const team = TEAM_KEYS.includes(me.div)?me.div:'DC';
        S.projects.push({id:uid('pr'), title:t, col:colId, teams:[team], client:'', due:'', desc:'', by:me.id});
        saveState();
      }
      render();
    };
    input.addEventListener('keydown',e=>{ if(e.key==='Enter') commit(); if(e.key==='Escape') render(); });
    input.addEventListener('blur',commit);
  });
  /* quick add client */
  root.querySelectorAll('.quick-add[data-qc]').forEach(b=>b.onclick=()=>openClientModal(null,b.dataset.qc));

  /* column mgmt (project board only) */
  root.querySelectorAll('input[data-rename]').forEach(inp=>{
    const commit=()=>{
      const col=S.columns.find(c=>c.id===inp.dataset.rename);
      const v=inp.value.trim();
      if(col&&v&&v!==col.name){ col.name=v; saveState(); }
    };
    inp.addEventListener('keydown',e=>{ if(e.key==='Enter'){ commit(); inp.blur(); } });
    inp.addEventListener('blur',commit);
    inp.addEventListener('click',e=>e.stopPropagation());
  });
  root.querySelectorAll('[data-addcol]').forEach(b=>b.onclick=()=>{
    S.columns.push({id:uid('col'), name:'Kolom Baru'});
    saveState(); render();
  });
  root.querySelectorAll('[data-delcol]').forEach(b=>b.onclick=()=>{
    if(S.columns.length<=1) return;
    const id=b.dataset.delcol;
    const target=S.columns.find(c=>c.id!==id);
    S.projects.forEach(p=>{ if(p.col===id) p.col=target.id; });
    S.columns=S.columns.filter(c=>c.id!==id);
    saveState(); render();
  });

  /* kalender */
  root.querySelectorAll('[data-calnav]').forEach(b=>b.onclick=()=>{
    cal.m+=parseInt(b.dataset.calnav,10);
    if(cal.m<0){cal.m=11;cal.y--} if(cal.m>11){cal.m=0;cal.y++}
    render();
  });
  root.querySelectorAll('[data-caltoday]').forEach(b=>b.onclick=()=>{
    cal={y:new Date().getFullYear(), m:new Date().getMonth()}; selDay=today(); render();
  });
  root.querySelectorAll('[data-addev]').forEach(b=>b.onclick=()=>openEventModal(selDay));
  root.querySelectorAll('[data-dayev]').forEach(b=>b.onclick=()=>openEventModal(null,b.dataset.dayev));
  root.querySelectorAll('[data-dayproj]').forEach(b=>b.onclick=()=>openCardModal(b.dataset.dayproj));
  root.querySelectorAll('.cal-ev').forEach(b=>{
    b.addEventListener('click',e=>{
      e.stopPropagation();
      const id=b.dataset.ev;
      if(id.startsWith('proj_')) openCardModal(id.slice(5));
      else openEventModal(null,id);
    });
    b.addEventListener('dragstart',e=>{
      e.stopPropagation();
      e.dataTransfer.setData('text/plain','cal:'+b.dataset.ev);
      e.dataTransfer.effectAllowed='move';
      b.classList.add('dragging');
    });
    b.addEventListener('dragend',()=>b.classList.remove('dragging'));
  });
  root.querySelectorAll('.cal-cell').forEach(c=>{
    c.addEventListener('click',()=>{ selDay=c.dataset.day; render(); });
    c.addEventListener('keydown',e=>{ if(e.key==='Enter'){ selDay=c.dataset.day; render(); } });
    c.addEventListener('dragover',e=>{ e.preventDefault(); c.style.background='var(--hover-tint)'; });
    c.addEventListener('dragleave',()=>{ c.style.background=''; });
    c.addEventListener('drop',e=>{
      e.preventDefault(); c.style.background='';
      const raw=e.dataTransfer.getData('text/plain');
      if(!raw.startsWith('cal:')) return;
      const id=raw.slice(4);
      if(id.startsWith('proj_')){
        const p=S.projects.find(x=>x.id===id.slice(5));
        if(p && p.due!==c.dataset.day){ p.due=c.dataset.day; saveState(); render(); }
      } else {
        const ev=S.events.find(x=>x.id===id);
        if(ev && ev.date!==c.dataset.day){ ev.date=c.dataset.day; saveState(); render(); }
      }
    });
  });
}

/* =============== BOOT =============== */
(async ()=>{
  applyTheme();
  const { data:{ session } } = await sb.auth.getSession();
  if(session) await afterAuth(session);
})();

if('serviceWorker' in navigator){
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js'));
}
</script>
</body>
</html>
